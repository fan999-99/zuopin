    :root {
      --bg: #070E18;
      --bg-2: #0A1628;
      --blue: #1557E8;
      --cyan: #00D4FF;
      --text: #C4D5E6;
      --mute: #8CA0B8;
      --title: #F4F8FD;
      --radius: 96px;
      --cx: 50%;
      --cy: 50%;
      --anc: 0.2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans SC", -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }

    body.is-dragging { cursor: grabbing; }

    a, button { font: inherit; color: inherit; }

    a {
      text-decoration: none;
      color: var(--title);
    }

    a:hover { color: var(--cyan); }
    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 46%, var(--bg-2), var(--bg) 62%);
    }

    .quiet {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 46%, #1A5BFF 0%, var(--blue) 34%, #081530 76%);
      clip-path: circle(var(--radius) at var(--cx) var(--cy));
      will-change: clip-path;
    }

    .quiet::before,
    .quiet::after {
      content: "";
      position: absolute;
      left: var(--cx);
      top: var(--cy);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .quiet::before {
      width: calc(var(--radius) * 1.42);
      height: calc(var(--radius) * 1.42);
      box-shadow:
        0 0 0 1px rgba(0, 212, 255, 0.16),
        0 0 120px rgba(21, 87, 232, 0.35);
    }

    .quiet::after {
      width: calc(var(--radius) * 2);
      height: calc(var(--radius) * 2);
      box-shadow: inset 0 0 0 1px rgba(0, 212, 255, 0.55);
    }

    .line {
      position: absolute;
      left: var(--cx, 50%);
      top: var(--line-top, 72%);
      transform: translate(-50%, 0);
      padding-left: 0.18em;
      color: var(--title);
      font-size: clamp(16px, 2.1vw, 22px);
      font-weight: 700;
      letter-spacing: 0.18em;
      opacity: 0;
      transition: opacity 480ms ease;
      pointer-events: none;
      white-space: nowrap;
    }

    body.is-full .line { opacity: 1; }

    .noise-word {
      position: absolute;
      left: 0;
      top: 0;
      color: var(--mute);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.16em;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      opacity: 0.72;
      will-change: transform, opacity, color;
    }

    .noise-word.is-lg { font-size: 15px; opacity: 0.88; }

    .noise-word.is-pushed {
      color: var(--cyan);
      opacity: 0.95;
    }

    .phones {
      position: absolute;
      left: 50%;
      top: 47%;
      width: min(430px, 58vw, 66vh);
      transform: translate(-50%, -50%);
      z-index: 5;
      pointer-events: none;
      filter: drop-shadow(0 28px 48px rgba(0, 0, 0, 0.45));
    }

    .phones img {
      display: block;
      width: 100%;
      height: auto;
    }

    .topbar, .hint, .dial, .foot {
      z-index: 6;
      user-select: none;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: max(22px, env(safe-area-inset-top)) 28px 0;
      pointer-events: none;
    }

    .wordmark {
      display: block;
      height: 16px;
      width: auto;
      pointer-events: auto;
    }

    .wordmark svg {
      display: block;
      height: 16px;
      width: auto;
    }

    .model {
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--mute);
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: max(56px, calc(env(safe-area-inset-bottom) + 40px));
      transform: translateX(-50%);
      font-size: 13px;
      letter-spacing: 0.16em;
      color: var(--mute);
      transition: opacity 350ms ease;
      white-space: nowrap;
      pointer-events: none;
    }

    body.is-dragging .hint,
    body.has-played .hint,
    body.is-full .hint {
      opacity: 0 !important;
      visibility: hidden;
    }

    .top-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: auto;
    }

    .sound {
      background: none;
      border: 0;
      padding: 0;
      color: var(--mute);
      font-size: 11px;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    .sound:hover { color: var(--title); }
    .sound[aria-pressed="false"] { color: var(--mute); opacity: 0.7; }

    .dial {
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--cyan);
      font-family: "Noto Sans Mono SC", "Noto Sans SC", monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      opacity: 0;
      transition: opacity 160ms ease;
      white-space: nowrap;
      pointer-events: none;
    }

    body.is-dragging .dial { opacity: 1; }

    .dial-tick {
      width: 18px;
      height: 1px;
      background: var(--cyan);
    }

    .foot {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      font-size: 11px;
      color: var(--mute);
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    .foot a { pointer-events: auto; color: var(--mute); }
    .foot a:hover { color: var(--title); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .control {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .control:focus-visible ~ .phones {
      outline: 2px solid var(--cyan);
      outline-offset: 18px;
      border-radius: 50%;
    }

    @media (max-width: 720px) {
      .topbar { padding-left: 18px; padding-right: 18px; }
      .model { max-width: 42vw; text-align: right; }
      .phones { width: min(66vw, 300px, 52vh); top: 46%; }
      .noise-word { font-size: 11px; letter-spacing: 0.08em; }
      .noise-word.is-lg { font-size: 12px; }
      .hint { font-size: 12px; letter-spacing: 0.08em; bottom: max(64px, calc(env(safe-area-inset-bottom) + 48px)); }
      .foot {
        left: 18px;
        right: 18px;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
      .line { letter-spacing: 0.1em; padding-left: 0.1em; font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .noise-word, .line, .hint, .dial { transition: none !important; }
    }
  </style>
</head>

  <script>
    const WORDS = [
      ["地铁报站", -160, 200, 1],
      ["施工", -128, 292, 0],
      ["空调外机", -98, 238, 0],
      ["谈话", -66, 330, 1],
      ["刹车", -30, 214, 0],
      ["咖啡机", 6, 304, 0],
      ["键盘", 38, 236, 0],
      ["通知音", 70, 326, 1],
      ["人潮", 104, 214, 1],
      ["飞机过顶", 138, 292, 0],
      ["外卖铃声", 170, 236, 0],
      ["电梯广播", -178, 310, 0],
      ["开放式办公", -112, 390, 1],
      ["雨刮", 46, 392, 0],
      ["婴儿车", 118, 380, 0],
      ["喇叭", -42, 414, 1]
    ];

    const stage = document.getElementById("stage");
    const wordsRoot = document.getElementById("words");
    const dial = document.getElementById("dial");
    const dialText = document.getElementById("dialText");
    const live = document.getElementById("live");
    const control = document.getElementById("control");
    const phonesEl = document.querySelector(".phones");
    const soundBtn = document.getElementById("sound");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const nodes = WORDS.map(([text, angle, dist, large]) => {
      const el = document.createElement("span");
      el.className = "noise-word" + (large ? " is-lg" : "");
      el.textContent = text;
      wordsRoot.appendChild(el);
      return { el, angle: angle * Math.PI / 180, base: dist, jitter: Math.random() * Math.PI * 2, fit: angle * Math.PI / 180 };
    });

    let width = 0, height = 0, cx = 0, cy = 0, minR = 0, maxR = 0, radius = 0;
    let dragging = false;

    function layout() {
      const rect = stage.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      const pr = phonesEl.getBoundingClientRect();
      cx = pr.left - rect.left + pr.width / 2;
      cy = pr.top - rect.top + pr.height / 2;
      minR = Math.min(pr.width, pr.height) * 0.28;
      const footTop = document.querySelector(".foot").getBoundingClientRect().top - rect.top;
      const lineTop = Math.min(pr.bottom - rect.top + Math.max(22, height * 0.04), footTop - 44);
      document.documentElement.style.setProperty("--line-top", lineTop + "px");
      maxR = Math.hypot(width, height) * 0.58;
      if (!radius) radius = minR;
      radius = Math.min(Math.max(radius, minR), maxR);
      nodes.forEach((w) => { w.fit = fitAngle(w.angle); });
      apply();
    }

    function keepOutAt(angle, padX, padY) {
      const r = phonesEl.getBoundingClientRect();
      const rx = r.width * 0.5 + (padX == null ? 36 : padX);
      const ry = r.height * 0.5 + (padY == null ? 28 : padY);
      const c = Math.cos(angle);
      const s = Math.sin(angle);
      return (rx * ry) / Math.max(0.0001, Math.hypot(ry * c, rx * s));
    }

    function maxDistInView(angle, insetX, insetY) {
      const padX = insetX == null ? 24 : insetX;
      const padY = insetY == null ? 64 : insetY;
      const dx = Math.cos(angle);
      const dy = Math.sin(angle);
      let tx = Infinity, ty = Infinity;
      if (Math.abs(dx) > 0.001) tx = ((dx > 0 ? width - padX : padX) - cx) / dx;
      const topPad = Math.max(padY, document.querySelector(".topbar").getBoundingClientRect().bottom + 14 + (padY - 56 > 0 ? padY - 56 : 0));
      if (Math.abs(dy) > 0.001) ty = ((dy > 0 ? height - padY : topPad) - cy) / dy;
      return Math.max(0, Math.min(tx, ty));
    }

    function fitAngle(angle) {
      const room = (a) => maxDistInView(a) - keepOutAt(a);
      if (room(angle) >= 16) return angle;
      let best = angle, bestRoom = room(angle);
      for (let deg = 6; deg <= 90; deg += 6) {
        for (const sign of [-1, 1]) {
          const t = angle + sign * deg * Math.PI / 180;
          const r = room(t);
          if (r > bestRoom) {
            bestRoom = r;
            best = t;
            if (r >= 16) return t;
          }
        }
      }
      return best;
    }

    function levelLabel(r) {
      const t = (r - minR) / (maxR - minR);
      if (t > 0.82) return "安静";
      if (t > 0.45) return "安静 · 扩大中";
      return "安静 · 开始";
    }

    let audio = null;
    let muted = false;

    function applyAudio() {
      if (!audio) return;
      const t = audio.ctx.currentTime;
      if (muted) {
        audio.cityGain.gain.setTargetAtTime(0, t, 0.05);
        return;
      }
      const anc = (radius - minR) / Math.max(maxR - minR, 1);
      const left = Math.max(0, 1 - anc / 0.82);
      audio.cityGain.gain.setTargetAtTime(Math.pow(left, 1.4) * 0.46, t, 0.08);
      audio.filter.frequency.setTargetAtTime(500 + Math.pow(left, 1.15) * 7500, t, 0.1);
    }

    async function loadBuffer(ctx, url) {
      if (url.slice(0, 5) === "data:") {
        const raw = atob(url.split(",")[1]);
        const arr = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
        return ctx.decodeAudioData(arr.buffer.slice(0));
      }
      const res = await fetch(url);
      return ctx.decodeAudioData(await res.arrayBuffer());
    }

    async function setupAudio() {
      if (audio) return audio;

      function loop(buf, dest) {
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.loop = true;
        src.connect(dest);
        src.start();
      }
      loop(cityBuf, filter);
      audio = { ctx, cityGain, filter };
      applyAudio();
      return audio;

    function armAudio() {
      if (muted) return;
      setupAudio().then((a) => a.ctx.resume()).catch(() => {});
    }

    soundBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      muted = !muted;
      soundBtn.setAttribute("aria-pressed", muted ? "false" : "true");
      soundBtn.textContent = muted ? "声音关" : "声音开";
      soundBtn.setAttribute("aria-label", muted ? "打开声音" : "关闭声音");
      if (!muted) armAudio();
      applyAudio();
    });

    function apply() {
      const root = document.documentElement;
      root.style.setProperty("--radius", radius + "px");
      root.style.setProperty("--cx", cx + "px");
      root.style.setProperty("--cy", cy + "px");
      const anc = (radius - minR) / Math.max(maxR - minR, 1);
      root.style.setProperty("--anc", anc.toFixed(3));
      document.body.classList.toggle("is-full", anc > 0.82);
      if (anc > 0.04) document.body.classList.add("has-played");
      applyAudio();

      const hb = document.querySelector(".topbar").getBoundingClientRect();
      const topSafe = hb.bottom + 14;
      const now = performance.now();
      const scale = Math.min(width, height) / 780;
      nodes.forEach((w, i) => {
        const angle = w.fit;
        const halfW = Math.max(12, w.el.offsetWidth / 2);
        const halfH = Math.max(8, w.el.offsetHeight / 2);
        const safe = keepOutAt(angle, 32 + halfW * Math.abs(Math.cos(angle)), 24 + halfH * Math.abs(Math.sin(angle)));
        const maxD = maxDistInView(angle, 16 + halfW, 56 + halfH);
        let d = Math.max(w.base * scale, safe);
        const push = 28 + (i % 5) * 4;
        let pushed = false;
        if (radius + 10 >= d) {
          d = radius + push;
          pushed = true;
        }
        const overflow = pushed ? Math.max(0, d - maxD) : 0;
        d = Math.min(d, maxD);
        const hidden = maxD < safe - 4;
        let jx = 0, jy = 0;
        if (!reduce && !pushed && !hidden) {
          const t = now / 1000;
          jx = Math.sin(t * 1.25 + w.jitter) * 2.4;
          jy = Math.cos(t * 1.05 + w.jitter) * 2.4;
        }
        let x = cx + Math.cos(angle) * d + jx;
        let y = cy + Math.sin(angle) * d + jy;
        x = Math.min(Math.max(x, halfW + 10), width - halfW - 10);
        y = Math.min(Math.max(y, topSafe + halfH), height - halfH - 56);
        w.el.style.transform = "translate(" + x + "px, " + y + "px) translate(-50%, -50%)";
        w.el.classList.toggle("is-pushed", pushed);
        if (hidden) {
          w.el.style.opacity = "0";
        } else if (pushed && (overflow > 0 || anc > 0.6)) {
          const byEdge = 1 - overflow / 48;
          const byAnc = 1 - Math.max(0, anc - 0.6) / 0.2;
          w.el.style.opacity = String(Math.max(0, Math.min(byEdge, byAnc)));
        } else {
          w.el.style.opacity = "";
        }
      });
    }

    function setRadius(next, announce) {
      radius = Math.min(Math.max(next, minR), maxR);
      apply();
      if (announce) live.textContent = levelLabel(radius);
    }

    function setDial(clientX, clientY) {
      const angle = Math.atan2(clientY - cy, clientX - cx);
      let x = cx + Math.cos(angle) * (radius + 26);
      let y = cy + Math.sin(angle) * (radius + 26);
      x = Math.min(Math.max(x, 28), width - 28);
      y = Math.min(Math.max(y, document.querySelector(".topbar").getBoundingClientRect().bottom + 16), height - 48);
      dial.style.left = "0";
      dial.style.top = "0";
      dial.style.transform = "translate(" + x + "px, " + y + "px) translate(-50%, -50%)";
      dialText.textContent = levelLabel(radius);
    }

    function onDown(e) {
      dragging = true;
      document.body.classList.add("is-dragging", "has-played");
      armAudio();
      setRadius(Math.hypot(e.clientX - cx, e.clientY - cy));
      setDial(e.clientX, e.clientY);
    }

    function onMove(e) {
      if (!dragging) return;
      setRadius(Math.hypot(e.clientX - cx, e.clientY - cy));
      setDial(e.clientX, e.clientY);
    }

    function onUp() {
      if (!dragging) return;
      dragging = false;
      document.body.classList.remove("is-dragging");
      live.textContent = levelLabel(radius);
    }

    stage.addEventListener("pointerdown", (e) => {
      if (e.target.closest && e.target.closest("a, .sound")) return;
      stage.setPointerCapture(e.pointerId);
      onDown(e);
    });
    stage.addEventListener("pointermove", onMove);
    stage.addEventListener("pointerup", onUp);
    stage.addEventListener("pointercancel", onUp);

    control.addEventListener("keydown", (e) => {
      const step = 28;
      if (e.key === "ArrowUp" || e.key === "ArrowRight") {
        e.preventDefault();
        document.body.classList.add("has-played");
        armAudio();
        setRadius(radius + step, true);
      } else if (e.key === "ArrowDown" || e.key === "ArrowLeft") {
        e.preventDefault();
        setRadius(radius - step, true);
      } else if (e.key === " ") {
        e.preventDefault();
        document.body.classList.add("has-played");
        armAudio();
        setRadius(radius > (minR + maxR) / 2 ? minR : maxR, true);
      }
    });

    window.addEventListener("resize", layout);
    layout();

    if (!reduce) {
      const tick = () => { if (!dragging) apply(); requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    }

    const params = new URLSearchParams(location.search);
    if (params.has("preview")) {
      const p = parseFloat(params.get("preview"));
      if (!Number.isNaN(p)) {
        setRadius(minR + (maxR - minR) * Math.min(Math.max(p, 0), 1));
        const angle = -Math.PI * 0.28;
        setDial(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
        if (p > 0.08) document.body.classList.add("has-played");
        if (p > 0.15) document.body.classList.add("is-dragging");
      }
    }
  </script>
